<html>
<head>
	<link type="text/css" rel="stylesheet" href="/style-guide/css/fluig-style-guide-flat.min.css"/>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery.js"></script>
	<script type="text/javascript" src="/portal/resources/js/jquery/jquery-ui.min.js"></script>
	<script type="text/javascript" src="/portal/resources/js/mustache/mustache-min.js"></script>
	<script type="text/javascript" src="/style-guide/js/fluig-style-guide.min.js" charset="utf-8"></script>
</head>
<body>
<div class="fluig-style-guide">
<form name="form" role="form">

	<!-- Painel Cadastro de Usuario Fluig -->
	<div class="panel panel-primary">
		<div class="panel-heading">
			<h3 class="panel-title">Cadastro de Usuario Fluig</h3>
		</div>
		<div class="panel-body">
			<div class="row">
				<div class="col-md-6">
					<div class="form-group">
						<label for="nome">Nome</label>
						<input type="text" class="form-control" name="nome" id="nome" placeholder="Nome completo" required>
					</div>
				</div>
				<div class="col-md-6">
					<div class="form-group">
						<label for="login">Login</label>
						<input type="text" class="form-control" name="login" id="login" placeholder="Login de acesso" required>
					</div>
				</div>
			</div>
			<div class="row">
				<div class="col-md-4">
					<div class="form-group">
						<label for="matricula">Matricula</label>
						<input type="text" class="form-control" name="matricula" id="matricula" placeholder="Numero da matricula" required>
					</div>
				</div>
				<div class="col-md-4">
					<div class="form-group">
						<label for="email">E-mail</label>
						<input type="email" class="form-control" name="email" id="email" placeholder="email@exemplo.com" required>
					</div>
				</div>
				<div class="col-md-4">
					<div class="form-group">
						<label for="senha">Senha</label>
						<input type="password" class="form-control" name="senha" id="senha" placeholder="Senha de acesso" required>
					</div>
				</div>
			</div>
		</div>
	</div>

</form>
</div>
</body>
</html>
